name: Publish to npm

on:
  push:
    branches:
      - main

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8 # Volvemos a la v8 para evitar los bloqueos de scripts de build

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        # --no-frozen-lockfile permite que pnpm v8 ignore el lockfile v12 y genere uno compatible en vuelo
        run: pnpm install --no-frozen-lockfile

      - name: Build library
        run: pnpm build

      - name: Publish to npm
        run: pnpm publish --no-git-checks --access public
