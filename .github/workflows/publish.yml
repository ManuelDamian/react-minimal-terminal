name: Publish to npm

on:
  push:
    branches:
      - main

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          # Usamos 'latest' para asegurar compatibilidad con el lockfile v12
          version: latest 

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        # Usamos install normal inicialmente para sincronizar el lockfile
        # Una vez que el primer build pase, podemos volver a --frozen-lockfile
        run: pnpm install

      - name: Build library
        run: pnpm build

      - name: Publish to npm
        run: pnpm publish --no-git-checks --access public
